<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{width:1200px;height:630px;padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between;background:#fcfcfa}
.top{display:flex;align-items:center;gap:14px}
.mark{width:40px;height:40px;border-radius:9px;font-size:23px}
.top b{color:var(--ink);font-size:24px;font-weight:600}
.top span{color:var(--faint);font-size:22px}
h1{font-size:62px;line-height:1.08;font-weight:400;color:var(--ink);max-width:19ch;letter-spacing:-.01em}
p{font-size:23px;color:var(--muted);margin-top:22px;max-width:52ch}
.foot{display:flex;gap:44px;border-top:1px solid var(--rule);padding-top:22px;font-size:19px;color:var(--text)}
.foot b{font-weight:400;color:var(--ink)}
.foot span{color:var(--faint);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:6px}
</style>
<div class="top"><span class="mark">D</span><b>Denoro</b><span>Automations</span></div>
<div>
  <h1 class="serif">Sabrás cuándo tu competencia baja un precio</h1>
  <p>Vigilo los precios y el stock de las tiendas que me digas y te aviso por Telegram y email cuando cambia algo que te afecta.</p>
</div>
<div class="foot">
  <div><span>Para quién</span><b>Tiendas Shopify y WooCommerce</b></div>
  <div><span>Desde</span><b class="num">300 € · precio cerrado</b></div>
  <div><span>Entrega</span><b class="num">4–8 días</b></div>
</div>
